title: Controlled tail sought and removed inside soundReady
description: >-
  A newer seek in the Ready callback sets the outgoing segment offset without leaking progress or
  completion events.
durationMs: 1500
sampleRate: 48000
numberOfChannels: 2
assets:
  chirp:
    generator: tone
    frequency: 220
    endFrequency: 1320
states:
  - atMs: 0
    state:
      id: before-ready
      elements: []
      animations: []
      audio:
        - id: music
          type: audio-channel
          interruption: loopEnd
          children:
            - id: player
              type: sound
              src: chirp
              loop: true
              volume: 75
              startAt: 0.1
              endAt: 0.9
              playback:
                commandId: 1
                operation: play
                positionMs: 100
eventRenders:
  - event: soundReady
    id: player
    states:
      - id: seek-before-removal
        elements: []
        animations: []
        audio:
          - id: music
            type: audio-channel
            interruption: loopEnd
            children:
              - id: player
                type: sound
                src: chirp
                loop: true
                volume: 75
                startAt: 0.1
                endAt: 0.9
                playback:
                  commandId: 2
                  operation: seek
                  positionMs: 300
      - id: removed
        elements: []
        animations: []
        audio: []
