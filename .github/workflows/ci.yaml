name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build:all
      - run: bun run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            dist/
            vt/static/RouteGraphics.js*
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, audio, browser, webgpu]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: .
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Install WebKit
        if: matrix.suite == 'browser'
        run: bunx playwright install --with-deps webkit
      - name: Unit and CLI tests
        if: matrix.suite == 'unit'
        env:
          VITEST_MAX_WORKERS: 2
        run: bun run test
      - name: Deterministic audio rendering
        if: matrix.suite == 'audio'
        run: node scripts/audioVisualTest.mjs report
      - name: Browser integration
        if: matrix.suite == 'browser'
        run: |
          node scripts/testRuntimeLifecycle.mjs
          node scripts/testInputTouchFocus.mjs
          node scripts/testWheelPassive.mjs
          node scripts/testRendererReset.mjs
          node scripts/testVideoPlayback.mjs
          node scripts/testVideoAutoplayRefusal.mjs
          node scripts/testLayoutReport.mjs
          node scripts/testTransitionSnapshots.mjs --out-dir .rettangoli/transition-snapshots
          node scripts/testStoryExtraction.mjs --out-dir .rettangoli/story-extraction
      - name: WebGPU integration
        if: matrix.suite == 'webgpu'
        run: node scripts/testWebGPUShaders.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failures-${{ matrix.suite }}-${{ github.run_number }}
          path: |
            avt/output/
            .rettangoli/
          include-hidden-files: true
          retention-days: 14
  visual:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: .
      # Each shard captures and compares only its own specs; adding a shard
      # to the matrix rebalances them automatically.
      - name: Visual regression
        env:
          RTGL_VT_DEBUG: true
          RTGL_VT_CONCURRENCY: 4
        run: |
          selectors="$(node scripts/vtShard.mjs ${{ strategy.job-index }} ${{ strategy.job-total }})"
          bun run vt:screenshot:built $selectors
          bun run vt:compare $selectors
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failures-visual-${{ matrix.shard }}-${{ github.run_number }}
          path: .rettangoli/
          include-hidden-files: true
          retention-days: 14
