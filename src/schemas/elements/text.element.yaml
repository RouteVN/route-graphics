$schema: http://json-schema.org/draft-07/schema#
title: Text Element
description: Schema for text element raw input
type: object
required:
  - id
  - type
  - x
  - y
$def:
  textShadow:
    description: Optional text shadow. Use null in an interaction style to remove a base shadow.
    oneOf:
      - type: "null"
      - type: object
        properties:
          color:
            type: string
            description: Shadow color
            default: black
          alpha:
            type: number
            description: Shadow opacity (0-1)
            minimum: 0
            maximum: 1
            default: 1
          blur:
            type: number
            description: Shadow blur radius in pixels
            minimum: 0
            default: 0
          offsetX:
            type: number
            description: Horizontal shadow offset in pixels
            default: 2
          offsetY:
            type: number
            description: Vertical shadow offset in pixels
            default: 2
  textStyle:
    type: object
    properties:
      fill:
        type: string
        description: Text color
        default: black
      fontFamily:
        description: Font family or ordered fallback list
        oneOf:
          - type: string
            minLength: 1
          - type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              minLength: 1
      fontSize:
        type: number
        description: Font size in pixels
        default: 16
      align:
        type: string
        enum: [left, center, right]
        default: left
        description: Text alignment
      letterSpacing:
        type: number
        default: 0
        description: Extra spacing between graphemes in pixels. Negative values tighten spacing.
      textDecoration:
        type: string
        description: Use underline to draw a line below each text line.
      whiteSpace:
        type: string
        enum: [pre, normal, pre-line]
        default: pre
        description: Whitespace handling during text wrapping.
      lineHeight:
        type: number
        description: Line height in pixels
        default: 1.2
      wordWrap:
        type: boolean
        description: Enable word wrapping
        default: true
      breakWords:
        type: boolean
        description: Allow breaking words when wrapping
        default: true
      strokeColor:
        type: string
        description: Text stroke/outline color
      strokeWidth:
        type: number
        description: Text stroke/outline width
      padding:
        type: number
        minimum: 0
        description: Extra texture padding around rendered glyphs, useful for fonts with overhanging glyph bounds.
      shadow:
        "$ref": "#/$def/textShadow"
  contentSegment:
    type: object
    required:
      - text
    properties:
      text:
        type: string
      textStyle:
        "$ref": "#/$def/textStyle"
      furigana:
        type: object
        properties:
          text:
            type: string
          textStyle:
            "$ref": "#/$def/textStyle"
          placement:
            type: string
            enum: [top, bottom]
            default: top
            description: Side of the base text where furigana is placed.
          gap:
            type: number
            minimum: 0
            default: 0
            description: Additional distance in pixels between the furigana and base text.
properties:
  id:
    type: string
    description: Unique identifier for the text element
  type:
    const: text
    description: Element type, must be 'text'
  content:
    oneOf:
      - type: string
      - type: array
        items:
          "$ref": "#/$def/contentSegment"
    description: The text content to display. Strings render as one Pixi text object; arrays render static rich text segments.
    default: ""
  width:
    type: number
    description: Width constraint for text wrapping. When set, enables word wrap.
  writingMode:
    type: string
    enum:
      - horizontal-tb
      - vertical-rl
      - vertical-lr
    default: horizontal-tb
    description: >-
      Direction the text is laid out in. `vertical-rl` sets the text in
      columns that run top to bottom and flow from right to left, as used for
      Japanese and Chinese. `vertical-lr` is the same with columns flowing
      from left to right. In vertical mode `height` is the wrap dimension,
      `width` is measured, `textStyle.align` aligns along the column
      (left = top, center, right = bottom) and furigana `placement` top/bottom
      means the right/left side of the column.
  height:
    type: number
    description: >-
      Column length for vertical writing modes. When set, columns wrap at
      this height; when omitted, columns only break at explicit newlines.
      Ignored for horizontal text, whose height is always measured.
  x:
    type: number
    description: X position of the text
  y:
    type: number
    description: Y position of the text
  anchorX:
    type: number
    description: Horizontal anchor point where 0 is left edge, 1 is right edge (100% width). Values can extend beyond 0-1 range.
    default: 0
  anchorY:
    type: number
    description: Vertical anchor point where 0 is top edge, 1 is bottom edge (100% height). Values can extend beyond 0-1 range.
    default: 0
  originX:
    type: number
    description: Horizontal transform origin in pixels from the text layout box's left edge. Defaults to the anchor-derived X origin.
  originY:
    type: number
    description: Vertical transform origin in pixels from the text layout box's top edge. Defaults to the anchor-derived Y origin.
  scaleX:
    type: number
    description: Horizontal scale. Negative values mirror the text and zero collapses it.
  scaleY:
    type: number
    description: Vertical scale. Negative values mirror the text and zero collapses it.
  rotation:
    type: number
    description: Rotation in degrees
    default: 0
  alpha:
    type: number
    description: Opacity/transparency of the text (0-1)
    minimum: 0
    maximum: 1
    default: 1
  filters:
    $ref: "../shader-config.yaml#/definitions/elementFilters"
  textStyle:
    "$ref": "#/$def/textStyle"
  hover:
    type: object
    properties:
      textStyle:
        "$ref": "#/$def/textStyle"
      cursor:
        type: string
        description: CSS cursor style when hovering
      soundSrc:
        type: string
        description: URL to sound file to play on hover
      soundVolume:
        type: number
        description: Volume. 0 means muted. 100 means original full volume.
        minimum: 0
        maximum: 100
        default: 100
      payload:
        type: object
        description: Payload for hover action event
  click:
    type: object
    properties:
      textStyle:
        "$ref": "#/$def/textStyle"
      soundSrc:
        type: string
        description: URL to sound file to play on click
      soundVolume:
        type: number
        description: Volume. 0 means muted. 100 means original full volume.
        minimum: 0
        maximum: 100
        default: 100
      payload:
        type: object
        description: Payload for click action event
  rightClick:
    type: object
    properties:
      textStyle:
        "$ref": "#/$def/textStyle"
      soundSrc:
        type: string
        description: URL to sound file to play on right-click
      payload:
        type: object
        description: Payload for right-click action event
  scrollUp:
    type: object
    properties:
      payload:
        type: object
        description: Payload for scroll up action event
  scrollDown:
    type: object
    properties:
      payload:
        type: object
        description: Payload for scroll down action event
