---
title: "Nested Container Group Scale Tween"
description: "A 1280x720 container at scale 0.5 holds two 560x320 groups. The left group tweens its own scale from 1 to 0.5; the right group mirrors horizontally, tweening scaleX from 1 to -0.5 while scaleY stays 1. Both are linear over 1 second. Every value is the group's own scale; the outer 0.5 applies on top. Grey frames mark the 500ms frame (left 0.75, right scaleX 0.25) and white frames mark the end of each step. In the mirrored end state the darker box is on the right and the lighter box on the left."
specs:
  - "a nested group should tween by its own scale inside a scaled parent"
  - "a mirroring tween should flip the group about its anchor point"
  - "at 500ms every box should sit inside its grey frame"
  - "at 1000ms every box should sit inside its white frame"
steps:
  - action: keypress
    key: "n"
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 500
  - action: screenshot
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 500
  - action: screenshot
