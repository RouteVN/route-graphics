---
title: "Container Group Scale Auto And Pulse"
description: "The left 600x320 container runs an Auto scale tween from 1 to its next authored scale 0.5. The right one stays at scale 0.5 and pulses through keyframes 0.6 then back to 0.5. Both are linear and anchored at their centres. Grey frames mark the 500ms frame (left 0.75, right 0.6) and white frames mark the settled layout (both 0.5)."
specs:
  - "an Auto scale tween should end on the next authored scale of the group"
  - "keyframe values should be authored scales of the group, not of the scaled geometry"
  - "at 500ms the left group should be at 0.75 and the right group at 0.6, inside the grey frames"
  - "at 1000ms both groups should settle at 0.5 inside the white frames"
steps:
  - action: keypress
    key: "n"
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 500
  - action: screenshot
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 500
  - action: screenshot
