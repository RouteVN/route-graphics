---
title: "Container Group Scale From And To Zero"
description: "Three 400x240 containers anchored at their centres. The left one grows from scale 0 to 1, the middle one collapses from 1 to 0, and the right one is added with an update tween from initialValue 0 to its authored scale 0.8. All are linear over 1 second. Grey frames mark the 500ms frame (0.5, 0.5 and 0.4) and white frames mark the end of each step; a collapsed group draws nothing."
specs:
  - "a group at scale 0 should draw nothing and grow around its anchor point"
  - "a group tweened to 0 should shrink around its anchor point and disappear"
  - "a group added with initialValue 0 should pop in to its authored scale"
  - "returning to the first state should show only the middle group at scale 1"
steps:
  - action: keypress
    key: "n"
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 500
  - action: screenshot
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 500
  - action: screenshot
  - action: keypress
    key: b
  - action: screenshot
