---
title: "Update Tweens On Removed Elements In Scaled Containers"
description: "Two 600x320 containers at scale 0.5, anchored at their centres. In the second state the left one loses its darker box, which runs an update tween moving x from 40 to 360 in the container's unscaled units before it is deleted; the lighter box stays. The right container is removed and runs its own scale tween from 0.5 to 0.25 before it is deleted. Both are linear over 1 second. Grey frames mark the 500ms frame (the darker box at x 200, the right group at 0.375); the white frame marks the box that stays. At 1000ms both removed elements are gone."
specs:
  - "a removed child's update tween should use its container's unscaled units"
  - "a removed container's own scale tween should use its authored scale"
  - "at 500ms the moving box and the shrinking group should sit inside the grey frames"
  - "at 1000ms only the lighter box of the left group should remain"
steps:
  - action: keypress
    key: "n"
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 500
  - action: screenshot
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 500
  - action: screenshot
