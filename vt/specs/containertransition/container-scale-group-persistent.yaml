---
title: "Persistent Child Update In A Scaled Container"
description: "A 1280x720 container at scale 0.5. A box moves with a persistent x update keyframe from 80 to 720 in the container's units, linear over 1 second. At 400ms the next render moves only a sibling box. The moving box must keep its carried-over position and continue instead of restarting. Grey frames mark the moving box at 400ms and 500ms; white frames mark the sibling."
specs:
  - "a persistent child update in a scaled container should survive an unrelated rerender"
  - "the moving box should be inside the 400ms grey frame before and after the rerender"
  - "100ms later the moving box should be inside the 500ms grey frame"
steps:
  - action: keypress
    key: "n"
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 400
  - action: screenshot
  - action: keypress
    key: "n"
  - action: screenshot
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 100
  - action: screenshot
