---
title: "Container Group Scale Tween Next To A Loop"
description: "Two 600x320 containers anchored at their centres change their scale with an update tween while a looping alpha pulse runs on the same container: the left one grows from 0.5 to 1 with a keyframe, and the right one shrinks from 1 to its next authored scale 0.5 with an Auto tween, both linear over 1 second. The alpha loop goes 1 to 0.5 and back each second, so the boxes are dimmer at 500ms. A loop makes the next state draw first, but the scale tween must still start from the size on screen. Grey frames mark the 500ms frame (both at 0.75) and white frames mark the end of the scale tween (1 and 0.5)."
specs:
  - "a scale tween next to a loop should start from the size on screen, not the next state's size"
  - "at 500ms both groups should be at scale 0.75, every box inside a grey frame"
  - "at 1000ms the left group should be at 1 and the right group at 0.5, inside the white frames"
steps:
  - action: keypress
    key: "n"
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 500
  - action: screenshot
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 500
  - action: screenshot
