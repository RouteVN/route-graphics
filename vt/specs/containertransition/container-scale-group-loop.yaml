---
title: "Container Group Scale Loop On A New Base Scale"
description: "Two 600x320 containers anchored at their centres start a looping scale pulse in the same render that changes their scale. The left one goes from 0.5 to 1 and pulses 1 to 1.1 and back; the right one goes from 1 to 0.5 and pulses 0.5 to 0.6 and back. Each cycle is linear over 1 second. A loop never completes, so it runs on the next state's layout. Grey frames mark the peak at 500ms (1.1 and 0.6) and white frames mark the new base scale (1 and 0.5) at 1000ms."
specs:
  - "a scale loop that starts with a new base scale should pulse around the new scale"
  - "at 500ms both groups should be at their peak, every box inside a grey frame"
  - "at 1000ms both groups should be back at their new base scale inside the white frames"
steps:
  - action: keypress
    key: "n"
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 500
  - action: screenshot
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 500
  - action: screenshot
