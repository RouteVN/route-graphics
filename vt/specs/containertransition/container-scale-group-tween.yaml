---
title: "Container Group Scale Tween"
description: "Two 600x320 containers, each anchored at its centre, tween their scale as one group: the left one shrinks from 1 to 0.5 and the right one grows from 0.5 to 1, both linear over 1 second. Children keep their positions relative to the anchor at every frame, and the tween ends on the parsed layout. Guides come from an unscaled container: grey frames mark the halfway frame (both at scale 0.75) and white frames mark the end of each step, 8 px outside every box."
specs:
  - "the initial capture should show every box inside a white frame"
  - "at 500ms both groups should be at scale 0.75, every box inside a grey frame"
  - "at 1000ms the left group should be at 0.5 and the right group at 1, inside the white frames"
  - "returning to the first state should restore it without a tween"
steps:
  - action: keypress
    key: "n"
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 500
  - action: screenshot
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 500
  - action: screenshot
  - action: keypress
    key: b
  - action: screenshot
