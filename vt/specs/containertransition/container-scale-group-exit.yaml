---
title: "Exit And Entry Slides In A Scaled Container"
description: "A 1280x720 container at scale 0.5. In the second state the top box is removed with a transition sliding it from x 80 to 720, and a new bottom box enters sliding from x 720 to 80. Both are authored in the container's unscaled units and linear over 1 second, so at 500ms both are at x 400, one above the other. Grey frames mark the 500ms frame; the white frame marks the entering box at the end. The leaving box is gone at the end."
specs:
  - "a removed child's exit transition should use the container's unscaled units"
  - "at 500ms the leaving and entering boxes should be aligned inside the grey frames"
  - "at 1000ms only the entering box should remain, inside the white frame"
steps:
  - action: keypress
    key: "n"
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 500
  - action: screenshot
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 500
  - action: screenshot
---
