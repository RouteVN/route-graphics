---
title: "Child Tweens In A Scaled Container"
description: "A 1280x720 container at scale 0.5. Inside it, one box runs an update tween of x, y (relative), width and height, and a box added in the second state enters with a transition tweening x from 1200 to 880. All values are authored in the container's unscaled units and linear over 1 second. A third box stays still. Grey frames mark the 500ms frame and white frames the end of each step."
specs:
  - "child x, y, width and height tweens should use the container's unscaled units"
  - "a child transition's absolute x should use the container's unscaled units"
  - "at 500ms the moving and entering boxes should sit inside the grey frames"
  - "at 1000ms every box should sit inside its white frame without a jump"
steps:
  - action: keypress
    key: "n"
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 500
  - action: screenshot
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 500
  - action: screenshot
