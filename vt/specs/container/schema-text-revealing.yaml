---
title: Container defaults with revealing text
description: Revealing text renders inside containers with omitted coordinates, then updates through nested layout changes. Text is the feature under test; revealEffect none keeps every checkpoint deterministic.
specs:
  - an unpositioned container defaults to the origin and preserves explicit child coordinates
  - revealing text renders inside a nested horizontal container
  - updating the container position and nested layout moves all text and changes its content
  - a nested container may omit coordinates while participating in parent layout
  - navigating back restores the original position, content, and horizontal layout
steps:
  - action: keypress
    key: n
  - action: screenshot
  - action: keypress
    key: b
  - action: screenshot
---
