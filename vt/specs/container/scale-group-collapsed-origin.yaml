title: "Collapsed Container With An Origin In A Wrapping Flow"
description: "A 1280x720 container at scale 0.5 holds a horizontal row 520 wide and a vertical column 520 high, each with gap 40: a darker box, a container at scale 0 holding a white box, and a lighter box. The collapsed container is anchored at its centre and has an explicit origin of 400, far outside its anchor point. Like a collapsed rect it sits at its anchor point and takes no space, so the lighter box stays on the first line after the two gaps instead of wrapping. White frames from an unscaled container mark where each box must land."
specs:
  - "a collapsed container should draw nothing"
  - "a collapsed container's explicit origin should not push the next child onto a new line"
  - "every box should sit inside its white frame"
