---
title: "Container Group Scale Content"
description: "A 1280x720 container at scale 0.5, anchored at the canvas centre, holds text, a sprite, a rotated rect and a vertical flow container that wraps into a second column. Text is rendered because text scaling is under test. Guides from an unscaled container: white frames 8 px outside the sprite and each flow box, a corner bracket 8 px outside the text's top-left corner, and a white dot on the rotated rect's centre."
specs:
  - "text should scale with the group and start inside the corner bracket"
  - "a sprite should scale with the group into its frame"
  - "a rotated child should keep its rotation and sit centred on the dot"
  - "a vertical flow should keep its gaps and wrap column, scaled as one group"
