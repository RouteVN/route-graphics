title: "Collapsed Container In A Scaled Flow"
description: "A 1280x720 container at scale 0.5 holds a horizontal row and a vertical column, each with gap 40: a darker box, a container at scale 0 holding a white box, and a lighter box. Like a rect at scale 0, the collapsed container draws nothing and takes no space, so the lighter box follows the darker one after the two gaps around the collapsed container (80 units, 40 px). White frames from an unscaled container mark where each box must land."
specs:
  - "a collapsed container should draw nothing"
  - "a collapsed container should take no space in a horizontal or vertical flow, apart from the gap after it"
  - "every box should sit inside its white frame"
