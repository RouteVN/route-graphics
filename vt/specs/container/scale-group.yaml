---
title: Container Group Scale
description: >-
  A 1280x720 container anchored at the canvas centre is drawn at scale 0.5 and
  scales as one group, like a zoomed picture. Child positions, the horizontal
  row's gaps and the child sizes all scale around the anchor point. White
  frames, drawn by an unscaled container, mark where each box must land, 8 px
  outside it. In a correct capture every box, and the row of three boxes, sits
  centred inside its frame.
specs:
  - container scale should move child positions toward the anchor point
  - gaps in a horizontal row should scale with the group
  - child sizes should scale with the group
---
