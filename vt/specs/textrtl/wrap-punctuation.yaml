---
title: RTL Text - Punctuation And Numbers Across Line Breaks
description: Directions are resolved for the whole paragraph before lines are broken, so punctuation and numbers look the same at every width.
specs:
- in the top row the comma should always sit directly to the right of hello, also when hello ends a line
- in the middle row the number should read 456-123 from the left at every width
- in the bottom row the hyphen should stay between abc and def, or at the end of abc when the line breaks there
steps:
- action: screenshot
