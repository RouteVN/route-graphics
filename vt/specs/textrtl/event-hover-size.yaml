---
title: RTL Text - Hover Style That Changes Size
description: A hover textStyle that changes the font size places the runs of the line again.
specs:
- first screenshot should show both lines at the idle size
- second screenshot should show the first line larger, its words in the same order, not overlapping and still ending at the same right edge
steps:
- action: screenshot
- action: move
  x: 1000
  "y": 150
- action: wait
  ms: 200
- action: screenshot
