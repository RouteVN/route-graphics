---
title: Particles Transition Cancelled By Removal
description: The state that cancels a particle enter transition removes the field, and a second enter is cancelled by a state that keeps it.
specs:
  - cancelling the transition with a state that removes the field should leave an empty stage and no running emitter
  - a second enter cancelled by a state that keeps the field should show and start the field
  - only the second field should be emitting
skipInitialScreenshot: true
useBrowserScreenshot: true
steps:
  - action: keypress
    key: "n"
  - action: customEvent
    name: "snapShotKeyFrame"
    detail:
      deltaMS: 300
  - action: wait
    ms: 50
  - action: keypress
    key: "n"
  - action: assert
    type: js
    fn: vtAssert.particleCount
    args:
      - weather-particles
    value: null
  - action: customEvent
    name: "snapShotKeyFrame"
    detail:
      deltaMS: 500
  - action: wait
    ms: 50
  - action: customEvent
    name: "primeVtScreenshot"
  - action: wait
    ms: 50
  - action: screenshot
  - action: keypress
    key: "n"
  - action: customEvent
    name: "snapShotKeyFrame"
    detail:
      deltaMS: 300
  - action: wait
    ms: 50
  - action: keypress
    key: "n"
  - action: customEvent
    name: "snapShotKeyFrame"
    detail:
      deltaMS: 500
  - action: wait
    ms: 50
  - action: assert
    type: js
    fn: vtAssert.particleCount
    args:
      - weather-particles
    value: 30
  - action: screenshot
  - action: customEvent
    name: "snapShotKeyFrame"
    detail:
      deltaMS: 500
  - action: wait
    ms: 50
  - action: assert
    type: js
    fn: vtAssert.particleCount
    args:
      - weather-particles
    value: 60
  - action: screenshot
---
states:
  - id: empty
    elements:
      - &bg
        id: stage-bg
        type: rect
        x: 0
        "y": 0
        width: 1280
        height: 720
        fill: "#000000"
  - id: weather-entering
    elements:
      - *bg
      - &weather
        id: weather
        type: container
        x: 0
        "y": 0
        children:
          - &field
            id: weather-particles
            type: particles
            x: 0
            "y": 0
            width: 1280
            height: 720
            alpha: 1
            seed: 12345
            modules:
              emission:
                mode: continuous
                rate: 60
                maxActive: 120
                duration: infinite
                particleLifetime:
                  min: 4
                  max: 6
                source:
                  kind: rect
                  data:
                    x: 80
                    "y": 60
                    width: 1120
                    height: 360
              movement:
                velocity:
                  kind: directional
                  direction: 90
                  speed:
                    min: 60
                    max: 120
              appearance:
                texture:
                  shape: circle
                  radius: 8
                  color: "#FFFFFF"
    animations:
      - id: weather-enter
        targetId: weather
        type: transition
        next:
          tween:
            alpha:
              initialValue: 0
              keyframes:
                - duration: 1000
                  value: 1
                  easing: linear
  - id: weather-removed
    elements:
      - *bg
      - id: line-marker
        type: rect
        x: 160
        "y": 620
        width: 160
        height: 40
        fill: "#A6A6A6"
  - id: weather-entering-again
    elements:
      - *bg
      - *weather
    animations:
      - id: weather-enter-again
        targetId: weather
        type: transition
        next:
          tween:
            alpha:
              initialValue: 0
              keyframes:
                - duration: 1000
                  value: 1
                  easing: linear
  - id: line-four
    elements:
      - *bg
      - *weather
      - id: line-marker
        type: rect
        x: 960
        "y": 620
        width: 160
        height: 40
        fill: "#A6A6A6"
