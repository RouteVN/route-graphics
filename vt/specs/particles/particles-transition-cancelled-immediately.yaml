---
title: Particles Transition Cancelled Immediately
description: A prefilled particle field is itself the transition target, and the next state arrives before the transition has advanced a frame.
specs:
  - a transition cancelled before its first frame should still leave the prefilled field on stage at full alpha
  - the prefilled particles should move between the two frames instead of staying frozen
  - the field should keep advancing across a later state that leaves it unchanged
skipInitialScreenshot: true
useBrowserScreenshot: true
steps:
  - action: keypress
    key: "n"
  - action: keypress
    key: "n"
  - action: assert
    type: js
    fn: vtAssert.particleCount
    args:
      - weather-particles
    value: 120
  - action: customEvent
    name: "snapShotKeyFrame"
    detail:
      deltaMS: 400
  - action: wait
    ms: 50
  - action: customEvent
    name: "primeVtScreenshot"
  - action: wait
    ms: 50
  - action: assert
    type: js
    fn: vtAssert.particleCount
    args:
      - weather-particles
    value: 120
  - action: screenshot
  - action: keypress
    key: "n"
  - action: customEvent
    name: "snapShotKeyFrame"
    detail:
      deltaMS: 400
  - action: wait
    ms: 50
  - action: assert
    type: js
    fn: vtAssert.particleCount
    args:
      - weather-particles
    value: 120
  - action: screenshot
---
states:
  - id: empty
    elements:
      - &bg
        id: stage-bg
        type: rect
        x: 0
        "y": 0
        width: 1280
        height: 720
        fill: "#000000"
  - id: weather-entering
    elements:
      - *bg
      - &field
        id: weather-particles
        type: particles
        x: 0
        "y": 0
        width: 1280
        height: 720
        alpha: 1
        seed: 12345
        modules:
          emission:
            mode: continuous
            rate: 60
            maxActive: 120
            duration: infinite
            particleLifetime:
              min: 4
              max: 6
            source:
              kind: rect
              data:
                x: 80
                "y": 60
                width: 1120
                height: 360
          movement:
            velocity:
              kind: directional
              direction: 90
              speed:
                min: 60
                max: 120
          appearance:
            texture:
              shape: circle
              radius: 8
              color: "#FFFFFF"
          bounds:
            mode: recycle
            source: area
            padding: 40
    animations:
      - id: weather-enter
        targetId: weather-particles
        type: transition
        next:
          tween:
            alpha:
              initialValue: 0
              keyframes:
                - duration: 1000
                  value: 1
                  easing: linear
  - id: line-two
    elements:
      - *bg
      - *field
      - id: line-marker
        type: rect
        x: 160
        "y": 620
        width: 160
        height: 40
        fill: "#A6A6A6"
  - id: line-three
    elements:
      - *bg
      - *field
      - id: line-marker
        type: rect
        x: 960
        "y": 620
        width: 160
        height: 40
        fill: "#A6A6A6"
