---
title: Vertical Text - Anchors
description: anchorX and anchorY position the measured column block around the marked point.
specs:
- anchor 0,0 should place the block right and below the cross
- anchor 0.5,0.5 should centre the block on the cross
- anchor 1,1 should place the block left and above the cross
- anchor 1,0 should hang the block from its top right corner
steps:
- action: screenshot
