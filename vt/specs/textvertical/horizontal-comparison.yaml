---
title: Vertical Text - Horizontal Comparison
description: The same content laid out horizontally and vertically, for comparing glyph forms and order.
specs:
- both layouts should show the same characters in reading order
- brackets, commas and the long vowel mark should change form between the two
steps:
- action: screenshot
---
states:
- elements:
  - id: l1
    type: text
    x: 80
    "y": 60
    content: horizontal-tb (default)
    textStyle:
      fontSize: 16
      fill: '#A6A6A6'
      fontFamily: Arial
  - id: h
    type: text
    x: 80
    "y": 100
    content: 「はい、12時にRouteVNで！」と答えた。ノートとコーヒー。
    textStyle:
      fontSize: 40
      fill: '#FFFFFF'
      fontFamily: NotoSansJP
      lineHeight: 1.6
  - id: l2
    type: text
    x: 80
    "y": 220
    content: vertical-rl
    textStyle:
      fontSize: 16
      fill: '#A6A6A6'
      fontFamily: Arial
  - id: v
    type: text
    writingMode: vertical-rl
    x: 400
    "y": 260
    height: 420
    anchorX: 1
    textStyle:
      fontSize: 40
      fill: '#FFFFFF'
      fontFamily: NotoSansJP
      lineHeight: 1.6
    content: 「はい、12時にRouteVNで！」と答えた。ノートとコーヒー。
  - id: l3
    type: text
    x: 600
    "y": 220
    content: vertical-rl with rich segments and furigana
    textStyle:
      fontSize: 16
      fill: '#A6A6A6'
      fontFamily: Arial
  - id: v2
    type: text
    writingMode: vertical-rl
    x: 1000
    "y": 260
    height: 420
    anchorX: 1
    textStyle:
      fontSize: 40
      fill: '#FFFFFF'
      fontFamily: NotoSansJP
      lineHeight: 2.0
    content:
    - text: 「
    - text: 返事
      furigana:
        text: へんじ
        textStyle:
          fontSize: 14
          fill: '#D9D9D9'
          fontFamily: NotoSansJP
    - text: は
    - text: '12'
      textStyle:
        fill: '#A6A6A6'
    - text: 時に
    - text: RouteVN
      textStyle:
        fontWeight: bold
    - text: で！」
