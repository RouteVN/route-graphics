---
title: Underline Plain and Rich Text Lifecycle
description: >-
  Underlines are visible decorations, including whitespace and letter spacing. New references cover
  multiline alignment, mixed rich segments, style updates, and removal.
specs:
  - plain multiline underlines include spaces and align with each line
  - rich segments independently enable and disable underline
  - font-size and fill updates redraw decoration; none removes it
  - removing the source leaves no decoration
steps:
  - action: keypress
    key: 'n'
  - action: screenshot
  - action: keypress
    key: 'n'
  - action: screenshot
---
states:
  - id: decorated
    elements:
      - id: plain
        type: text
        x: 64
        'y': 48
        content: |-
          Underline spans every space
          and each line.
        textStyle:
          fontFamily: Arial
          fontSize: 32
          fill: '#FFFFFF'
          textDecoration: underline
          lineHeight: 1.3
      - id: aligned
        type: text
        x: 520
        'y': 48
        content: |-
          Right aligned long line
          Short
        textStyle:
          fontFamily: Arial
          fontSize: 32
          fill: '#FFFFFF'
          textDecoration: underline
          align: right
          lineHeight: 1.3
        width: 650
      - id: rich
        type: text
        x: 64
        'y': 220
        content:
          - text: 'Decorated '
            textStyle:
              textDecoration: underline
          - text: 'plain '
            textStyle:
              textDecoration: none
          - text: and decorated
            textStyle:
              textDecoration: underline
              fill: '#A6A6A6'
        textStyle:
          fontFamily: Arial
          fontSize: 32
          fill: '#FFFFFF'
      - id: spaced
        type: text
        x: 64
        'y': 340
        content: LETTER SPACING
        textStyle:
          fontFamily: Arial
          fontSize: 32
          fill: '#FFFFFF'
          textDecoration: underline
          letterSpacing: 5
  - id: restyled
    elements:
      - id: plain
        type: text
        x: 64
        'y': 48
        content: Updated size and fill
        textStyle:
          fontFamily: Arial
          fontSize: 44
          fill: '#A6A6A6'
          textDecoration: underline
      - id: aligned
        type: text
        x: 520
        'y': 48
        content: |-
          Right aligned long line
          Short
        textStyle:
          fontFamily: Arial
          fontSize: 32
          fill: '#FFFFFF'
          textDecoration: none
          align: right
          lineHeight: 1.3
        width: 650
      - id: rich
        type: text
        x: 64
        'y': 220
        content:
          - text: Removed decoration
            textStyle:
              textDecoration: none
        textStyle:
          fontFamily: Arial
          fontSize: 32
          fill: '#FFFFFF'
      - id: spaced
        type: text
        x: 64
        'y': 340
        content: LETTER SPACING
        textStyle:
          fontFamily: Arial
          fontSize: 32
          fill: '#FFFFFF'
          textDecoration: none
          letterSpacing: 5
  - id: removed
    elements: []
