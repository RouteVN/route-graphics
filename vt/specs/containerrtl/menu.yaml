---
title: Reading Direction RTL - Arabic Menu
description: An Arabic menu and choice row built from containers, without readingDirection on the left and with readingDirection rtl on the right. Renders text because menus of right-to-left text are what the property is for.
specs:
  - the left menu should line its items up on their left edge
  - the right menu should line the same items up on their right edge
  - the upper choice row should place the widest choice first on the left
  - the lower choice row should place the widest choice first on the right, with the following choices to its left
---
