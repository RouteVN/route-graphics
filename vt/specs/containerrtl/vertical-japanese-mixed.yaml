---
title: Reading Direction RTL - Japanese Vertical Menu With English
description: The Japanese vertical menu with English words, letters and digits mixed into the vertical-rl items. Grey rects mark the containers. Renders text because mixed-script vertical menus are a common use of the property.
specs:
  - the upper menu has no readingDirection and should place the first item, NEW GAME, on the left
  - the lower menu sets readingDirection rtl and should place NEW GAME at the right edge of the container, with the following items to its left
  - items of only English, of Japanese followed by English, and of English or digits inside Japanese should each take one column and keep the same gap
  - both menus should draw every item identically; only the order of the columns differs
---
