---
title: Reading Direction RTL - Japanese Vertical Menu With Furigana
description: The Japanese vertical menu with furigana beside the kanji of each vertical-rl item, one item also ending in an English word. Grey rects mark the containers. Renders text because furigana widens each column, which the layout has to keep in order.
specs:
  - the upper menu has no readingDirection and should place the first item, 最初から, on the left
  - the lower menu sets readingDirection rtl and should place 最初から at the right edge of the container, with the following items to its left
  - furigana should stay on the right of its own kanji in both menus and should not overlap the neighbouring column
  - both menus should draw every item identically; only the order of the columns differs
---
