---
title: Reading Direction RTL - Update Between States
description: One wrapping container whose reading direction, children and layout axis change between states. The grey rect marks its width.
specs:
  - the first state should fill both rows from the left
  - the second state sets readingDirection rtl, and every rect should move to its mirrored place with both rows starting at the right
  - the third state adds a fifth rect, which should join the second row on its left
  - the fourth state changes direction to vertical, and the rects should stack in right-aligned columns that are added to the left
  - navigating back should restore the third state
steps:
  - action: keypress
    key: "n"
  - action: screenshot
  - action: keypress
    key: "n"
  - action: screenshot
  - action: keypress
    key: "n"
  - action: screenshot
  - action: keypress
    key: b
  - action: screenshot
