      - id: frame-ltr
        type: rect
        x: 60
        "y": 40
        width: 560
        height: 280
        fill: "#4D4D4D"
      - id: menu-ltr
        type: container
        x: 80
        "y": 60
        width: 520
        direction: horizontal
        gapX: 32
        children:
