---
title: Reading Direction RTL - Japanese Vertical Menu
description: A Japanese menu of vertical-rl text items in a horizontal container. Vertical Japanese is read in columns from right to left, so the first item belongs on the right. Grey rects mark the containers. Renders text because vertical text menus are a main use of the property.
specs:
  - the upper menu has no readingDirection and should place the first item, はじめから, on the left
  - the lower menu sets readingDirection rtl and should place はじめから at the right edge of the container, with the following items to its left and the free space on the left
  - every item should still read top to bottom
---
