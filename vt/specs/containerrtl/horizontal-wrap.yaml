---
title: Reading Direction RTL - Wrapping Rows
description: Five rects of different widths wrap into two rows inside a 520px container, left to right and right to left. Grey rects mark each container's width.
specs:
  - the left grid should fill each row from the left
  - the right grid should be its mirror image, with every row starting at the right edge of its frame
  - the second row of the right grid is not full and should leave its free space on the left
---
