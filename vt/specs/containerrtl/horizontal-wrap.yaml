      - id: frame-ltr
        type: rect
        x: 80
        "y": 80
        width: 520
        height: 260
        fill: "#4D4D4D"
      - id: grid-ltr
        type: container
        x: 80
        "y": 100
        width: 520
        direction: horizontal
        gapX: 20
        gapY: 20
        children:
