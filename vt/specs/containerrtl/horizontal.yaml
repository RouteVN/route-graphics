---
title: Reading Direction RTL - Horizontal Row
description: The same row of a wide, a medium and a narrow rect, left to right and right to left. Grey rects mark each container's width.
specs:
  - the top row should run left to right from the left edge of its grey frame
  - the second row should be its mirror image, with the wide rect at the right edge of the frame and the free space on the left
  - the third row has no width, so it should be the mirror image inside its own content width, starting at x 80
  - the fourth row is anchored by its right edge and should end at the right edge of the frames above it
---
