---
title: Reading Direction RTL - Scrolling
description: Right-to-left containers that overflow. Each row holds five 120px rects that get shorter in reading order, so the tallest rect is the first child. Grey rects mark the viewports. The scrollbar uses the coloured scrollbar assets of the other scrollbar specs.
diffThreshold: 0.5
specs:
  - first screenshot, the top row should start at its right end with the tallest rect at the right edge of the viewport
  - first screenshot, the second row uses anchorToBottom and should show its left end, with the shortest rect at the left edge
  - first screenshot, the list should line its rects up on the right edge and show its scrollbar on the left edge
  - second screenshot, wheeling left over the top row should bring the next rects in from the left
  - third screenshot, the top row should stop at its end with the shortest rect at the left edge
  - fourth screenshot, the top row should be back at its start, the second row should have moved 150px towards its start, and the list and its thumb should have scrolled down
steps:
  - action: move
    x: 290
    "y": 110
  - action: scroll
    deltaX: -150
    deltaY: 0
  - action: wait
    ms: 200
  - action: screenshot
  - action: scroll
    deltaX: -1000
    deltaY: 0
  - action: wait
    ms: 200
  - action: screenshot
  - action: scroll
    deltaX: 1000
    deltaY: 0
  - action: move
    x: 290
    "y": 290
  - action: scroll
    deltaX: 150
    deltaY: 0
  - action: move
    x: 800
    "y": 160
  - action: scroll
    deltaX: 0
    deltaY: 120
  - action: wait
    ms: 200
  - action: screenshot
