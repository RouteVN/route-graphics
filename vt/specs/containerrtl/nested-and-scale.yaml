title: Reading Direction RTL - Nested And Scaled Containers
description: Each container applies its own reading direction, and a scaled right-to-left container mirrors inside its scaled width. Grey rects mark the outer containers' widths.
specs:
  - first row, a right-to-left row whose middle child is a left-to-right column, the row should start at the right edge of its frame and the stacked rects inside it should line up on their left
  - second row, the same with a right-to-left column, the stacked rects should line up on their right
  - third row, a left-to-right row whose middle child is a right-to-left column, the row should start at the left edge and only the stacked rects should line up on their right
  - fourth row, the first row's layout at half scale with scaleX and scaleY 0.5, should be the first row at half size, starting at the right edge of its 300px frame
