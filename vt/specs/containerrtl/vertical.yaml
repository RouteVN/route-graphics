---
title: Reading Direction RTL - Columns
description: Vertical containers left to right and right to left, first as one column of rects with different widths and then wrapping into three columns. Grey rects mark each container's width.
specs:
  - the top left column should line its rects up on the left edge
  - the top right column should line the same rects up on the right edge
  - the bottom left container should add its wrapped columns to the right
  - the bottom right container should be its mirror image, with the first column at the right edge of its frame and later columns to its left
---
