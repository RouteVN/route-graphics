---
title: Vertical Text Revealing - Instant Speed
description: speed 100 renders the whole vertical text immediately; colored indicator assets are intentional.
specs:
- all columns should be visible on the first frame
steps:
- action: screenshot
---
states:
- elements:
  - id: r
    type: text-revealing
    writingMode: vertical-rl
    x: 1160
    "y": 60
    height: 560
    anchorX: 1
    speed: 100
    indicator:
      revealing:
        src: circle-red
        width: 14
        height: 14
      complete:
        src: circle-green
        width: 14
        height: 14
      offsetX: 12
    content:
    - text: メロスは激怒した。必ず、かの邪智暴虐の王を除かなければならぬと決意した。メロスには政治がわからぬ。メロスは、村の牧人である。笛を吹き、羊と遊んで暮して来た。けれども邪悪に対しては、人一倍に敏感であった。
      textStyle:
        fontSize: 28
        fill: '#FFFFFF'
        fontFamily: NotoSansJP
        lineHeight: 1.8
