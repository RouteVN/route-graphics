---
title: Vertical Text Revealing - Dialogue Window
description: A visual novel style vertical message window with a speaker name plate, mid-reveal and complete; colored indicator assets are intentional.
specs:
- the speaker name should stand in its own plate on the right
- the message should type down the columns inside the window
- the complete indicator should appear below the final character
steps:
- action: screenshot
- action: customEvent
  name: vtInstallTimeoutClock
- action: keypress
  key: n
- action: assert
  type: js
  fn: vtAssert.renderReady
  value: true
- action: customEvent
  name: vtAdvanceTimeoutClock
  detail:
    deltaMS: 800
- action: assert
  type: js
  fn: vtAssert.timersIdle
  value: true
- action: customEvent
  name: snapShotKeyFrame
  detail:
    deltaMS: 16
- action: screenshot
- action: customEvent
  name: vtAdvanceTimeoutClock
  detail:
    deltaMS: 30000
- action: assert
  type: js
  fn: vtAssert.timersIdle
  value: true
- action: customEvent
  name: snapShotKeyFrame
  detail:
    deltaMS: 16
- action: screenshot
---
states:
- id: blank
  elements:
  - id: win
    type: rect
    x: 320
    "y": 60
    width: 800
    height: 600
    fill: '#1F1F1F'
  - id: plate
    type: rect
    x: 1140
    "y": 60
    width: 80
    height: 240
    fill: '#333333'
  - id: name
    type: text
    writingMode: vertical-rl
    x: 1180
    "y": 180
    anchorX: 0.5
    anchorY: 0.5
    textStyle:
      fontSize: 40
      fill: '#FFFFFF'
      fontFamily: NotoSansJP
      lineHeight: 1.0
    content: 夏目
- id: talk
  elements:
  - id: win
    type: rect
    x: 320
    "y": 60
    width: 800
    height: 600
    fill: '#1F1F1F'
  - id: plate
    type: rect
    x: 1140
    "y": 60
    width: 80
    height: 240
    fill: '#333333'
  - id: name
    type: text
    writingMode: vertical-rl
    x: 1180
    "y": 180
    anchorX: 0.5
    anchorY: 0.5
    textStyle:
      fontSize: 40
      fill: '#FFFFFF'
      fontFamily: NotoSansJP
      lineHeight: 1.0
    content: 夏目
  - id: msg
    type: text-revealing
    writingMode: vertical-rl
    x: 1080
    "y": 100
    height: 500
    anchorX: 1
    speed: 50
    revealEffect: typewriter
    indicator:
      revealing:
        src: circle-red
        width: 14
        height: 14
      complete:
        src: circle-green
        width: 14
        height: 14
      offsetX: 12
    content:
    - text: 「
      textStyle:
        fontSize: 34
        fill: '#FFFFFF'
        fontFamily: NotoSansJP
        lineHeight: 1.8
    - text: 吾輩
      textStyle:
        fontSize: 34
        fill: '#FFFFFF'
        fontFamily: NotoSansJP
        lineHeight: 1.8
      furigana:
        text: わがはい
        textStyle:
          fontSize: 14
          fill: '#D9D9D9'
          fontFamily: NotoSansJP
    - text: は
      textStyle:
        fontSize: 34
        fill: '#FFFFFF'
        fontFamily: NotoSansJP
        lineHeight: 1.8
    - text: 猫
      textStyle:
        fontSize: 34
        fill: '#FFFFFF'
        fontFamily: NotoSansJP
        lineHeight: 1.8
      furigana:
        text: ねこ
        textStyle:
          fontSize: 14
          fill: '#D9D9D9'
          fontFamily: NotoSansJP
    - text: である。
      textStyle:
        fontSize: 34
        fill: '#FFFFFF'
        fontFamily: NotoSansJP
        lineHeight: 1.8
    - text: 名前
      textStyle:
        fontSize: 34
        fill: '#FFFFFF'
        fontFamily: NotoSansJP
        lineHeight: 1.8
      furigana:
        text: なまえ
        textStyle:
          fontSize: 14
          fill: '#D9D9D9'
          fontFamily: NotoSansJP
    - text: はまだ
      textStyle:
        fontSize: 34
        fill: '#FFFFFF'
        fontFamily: NotoSansJP
        lineHeight: 1.8
    - text: 無
      textStyle:
        fontSize: 34
        fill: '#FFFFFF'
        fontFamily: NotoSansJP
        lineHeight: 1.8
      furigana:
        text: な
        textStyle:
          fontSize: 14
          fill: '#D9D9D9'
          fontFamily: NotoSansJP
    - text: い。どこで生れたかとんと見当がつかぬ。」
      textStyle:
        fontSize: 34
