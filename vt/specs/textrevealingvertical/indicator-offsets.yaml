---
title: Vertical Text Revealing - Indicator Offsets
description: offsetX moves the indicator along the column (down); offsetY moves it towards the next column (left); colored indicator assets are intentional.
specs:
- offsetX should move the indicator farther below the text
- offsetY should move the indicator to the left of the column centre
- per-visual offsets should override the shared offsets
steps:
- action: screenshot
