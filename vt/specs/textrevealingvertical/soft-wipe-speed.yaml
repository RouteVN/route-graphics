---
title: Vertical Text Revealing - Soft Wipe Easing And Overlap
description: softWipe easing and lineOverlap apply per column in vertical mode; colored indicator assets are intentional.
specs:
- with overlap the next column should start before the previous one finishes
- easeOutCubic should slow the wipe towards the end of each column
steps:
- action: screenshot
- action: keypress
  key: n
- action: customEvent
  name: snapShotKeyFrame
  detail:
    deltaMS: 900
- action: screenshot
- action: customEvent
  name: snapShotKeyFrame
  detail:
    deltaMS: 1400
- action: screenshot
---
states:
- id: blank
  elements: []
- id: wipe
  elements:
  - id: r
    type: text-revealing
    writingMode: vertical-rl
    x: 1160
    "y": 60
    height: 520
    anchorX: 1
    speed: 30
    revealEffect: softWipe
    softWipe:
      easing: easeOutCubic
      lineOverlap: 0.5
      softness: 2
    indicator:
      revealing:
        src: circle-red
        width: 14
        height: 14
      complete:
        src: circle-green
        width: 14
        height: 14
      offsetX: 12
    content:
    - text: メロスは激怒した。必ず、かの邪智暴虐の王を除かなければならぬと決意した。メロスには政治がわからぬ。メロスは、村の牧人である。笛を吹き、羊と遊んで暮して来た。けれども邪悪に対しては、人一倍に敏感であった。
      textStyle:
        fontSize: 30
        fill: '#FFFFFF'
        fontFamily: NotoSansJP
        lineHeight: 1.8
