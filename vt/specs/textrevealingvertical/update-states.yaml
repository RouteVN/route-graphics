---
title: Vertical Text Revealing - Updates
description: Content, height and writing mode updates rebuild the vertical layout; colored indicator assets are intentional.
specs:
- updating content should replace the columns
- updating height should rewrap the columns
- switching to horizontal should lay the same content out in lines
steps:
- action: screenshot
- action: keypress
  key: n
- action: screenshot
