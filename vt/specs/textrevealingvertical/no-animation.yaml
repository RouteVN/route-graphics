---
title: Vertical Text Revealing - No Animation
description: revealEffect none shows the whole vertical text at once with the complete indicator below the last character; colored indicator assets are intentional.
specs:
- all columns should be visible immediately
- the complete indicator should sit below the last character, centred on its column
steps:
- action: screenshot
---
states:
- elements:
  - id: r
    type: text-revealing
    writingMode: vertical-rl
    x: 1160
    "y": 60
    height: 520
    anchorX: 1
    revealEffect: none
    indicator:
      revealing:
        src: circle-red
        width: 14
        height: 14
      complete:
        src: circle-green
        width: 14
        height: 14
      offsetX: 12
    content:
    - text: 吾輩は猫である。名前はまだ無い。どこで生れたかとんと見当がつかぬ。何でも薄暗いじめじめした所でニャーニャー泣いていた事だけは記憶している。
      textStyle:
        fontSize: 34
        fill: '#FFFFFF'
        fontFamily: NotoSansJP
        lineHeight: 1.8
