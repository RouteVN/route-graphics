---
title: Vertical Text Revealing LR - Soft Wipe
description: softWipe in vertical-lr wipes the left-most column first and moves right; colored indicator assets are intentional.
specs:
- first state should be blank before the reveal starts
- the wipe should travel down the left-most column first
- columns to the right should stay hidden until the wipe reaches them
- the complete indicator should appear after the last column
steps:
- action: screenshot
- action: keypress
  key: n
- action: customEvent
  name: snapShotKeyFrame
  detail:
    deltaMS: 700
- action: screenshot
- action: customEvent
  name: snapShotKeyFrame
  detail:
    deltaMS: 1600
- action: screenshot
- action: customEvent
  name: snapShotKeyFrame
  detail:
    deltaMS: 9000
- action: screenshot
---
