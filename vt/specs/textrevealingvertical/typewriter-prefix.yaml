---
title: Vertical Text Revealing - Initial Revealed Characters
description: initialRevealedCharacters keeps a prefix visible and continues typing from there; colored indicator assets are intentional.
specs:
- the prefix should be visible on the first frame after the update
- typing should continue from the end of the prefix
steps:
- action: screenshot
- action: customEvent
  name: vtInstallTimeoutClock
- action: keypress
  key: n
- action: assert
  type: js
  fn: vtAssert.renderReady
  value: true
- action: customEvent
  name: vtAdvanceTimeoutClock
  detail:
    deltaMS: 1
- action: assert
  type: js
  fn: vtAssert.timersIdle
  value: true
- action: customEvent
  name: snapShotKeyFrame
  detail:
    deltaMS: 16
- action: screenshot
- action: customEvent
  name: vtAdvanceTimeoutClock
  detail:
    deltaMS: 400
- action: assert
  type: js
  fn: vtAssert.timersIdle
  value: true
- action: customEvent
  name: snapShotKeyFrame
  detail:
    deltaMS: 16
- action: screenshot
- action: customEvent
  name: vtAdvanceTimeoutClock
  detail:
    deltaMS: 30000
- action: assert
  type: js
  fn: vtAssert.timersIdle
  value: true
- action: customEvent
  name: snapShotKeyFrame
  detail:
    deltaMS: 16
- action: screenshot
---
states:
- id: prefix
  elements:
  - id: r
    type: text-revealing
    writingMode: vertical-rl
    x: 900
    "y": 80
    height: 440
    anchorX: 1
    revealEffect: none
    indicator:
      revealing:
        src: circle-red
        width: 14
        height: 14
      complete:
        src: circle-green
        width: 14
        height: 14
      offsetX: 12
    content:
    - text: 最初の一文。
      textStyle:
        fontSize: 34
        fill: '#FFFFFF'
        fontFamily: NotoSansJP
        lineHeight: 1.8
- id: continued
  elements:
  - id: r
    type: text-revealing
    writingMode: vertical-rl
    x: 900
    "y": 80
    height: 440
    anchorX: 1
    speed: 40
    initialRevealedCharacters: 6
    revealEffect: typewriter
    indicator:
      revealing:
        src: circle-red
        width: 14
        height: 14
      complete:
        src: circle-green
        width: 14
        height: 14
      offsetX: 12
    content:
    - text: 最初の一文。
      textStyle:
        fontSize: 34
        fill: '#FFFFFF'
        fontFamily: NotoSansJP
        lineHeight: 1.8
    - text: 続きの文章がここから現れる。
      textStyle:
        fontSize: 34
        fill: '#D9D9D9'
        fontFamily: NotoSansJP
        lineHeight: 1.8
