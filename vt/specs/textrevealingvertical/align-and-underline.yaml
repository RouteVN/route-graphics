---
title: Vertical Text Revealing - Align And Underline
description: Column alignment and underline sidelines work in text-revealing; colored indicator assets are intentional.
specs:
- centre alignment should centre each column in the fixed height
- underlined segments should show a sideline on the right
steps:
- action: screenshot
---
states:
- elements:
  - id: b
    type: rect
    x: 700
    "y": 80
    width: 260
    height: 480
    fill: '#333333'
