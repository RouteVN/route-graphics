---
title: RTL Text Revealing - Soft Wipe Same State Render
description: Rendering the same state again while a right-to-left softWipe runs continues the wipe from where it was; colored indicator assets are intentional.
specs:
  - the wipe should be part way along the first line from the right before the second render
  - right after the same state renders again the frame should be unchanged, not the full text
  - the wipe should then continue towards the left and into the next line
  - the complete indicator should appear after the last line
steps:
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 900
  - action: screenshot
  - action: keypress
    key: "n"
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 1
  - action: screenshot
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 1400
  - action: screenshot
  - action: customEvent
    name: snapShotKeyFrame
    detail:
      deltaMS: 8000
  - action: screenshot
---
states:
  - id: rtl-soft-wipe-first-render
    elements:
      - &panel
        id: b
        type: rect
        x: 240
        "y": 100
        width: 800
        height: 300
        fill: "#333333"
      - &line
        id: r
        type: text-revealing
        x: 240
        "y": 100
        direction: rtl
        width: 800
        speed: 22
        revealEffect: softWipe
        softWipe:
          easing: linear
        indicator:
          revealing:
            src: circle-red
            width: 14
            height: 14
          complete:
            src: circle-green
            width: 14
            height: 14
          offsetX: 10
        content:
          - text: "قالت ليلى: "
            textStyle: &arabic
              fontSize: 34
              fill: "#FFFFFF"
              fontFamily:
                - NotoSansArabic
                - NotoSansHebrew
                - Arial
              lineHeight: 1.6
          - text: "«مرحبا! هل تريد أن تلعب معي اليوم؟ الفصل 12 جاهز، والقصة تكمل من حيث توقفت.»"
            textStyle: *arabic
  - id: rtl-soft-wipe-same-state
    elements:
      - *panel
      - *line
