---
title: RTL Text Revealing - Updates
description: Switching a revealed element between left-to-right and right-to-left and changing its content; colored indicator assets are intentional.
specs:
- first state should be left to right
- second state should be the same content right to left
- third state should show new Hebrew content
steps:
- action: screenshot
- action: keypress
  key: n
- action: screenshot
- action: keypress
  key: n
- action: screenshot
---
