---
title: RTL Text Revealing - Typewriter Keeps Joined Shapes
description: A partly revealed Arabic word is shaped as if the rest of it were there, so letters do not change shape as the next one appears; colored indicator assets are intentional.
specs:
- first screenshot shows the full sentence for reference
- in the second screenshot each line stops inside a word; its last letter should have the joined shape it has in the full sentence, with an open connector, unless it is a letter that never joins forwards
- the last screenshot should show the same full sentence on every line
steps:
- action: screenshot
- action: customEvent
  name: vtInstallTimeoutClock
- action: keypress
  key: n
- action: assert
  type: js
  fn: vtAssert.renderReady
  value: true
- action: customEvent
  name: vtAdvanceTimeoutClock
  detail:
    deltaMS: 1
- action: assert
  type: js
  fn: vtAssert.timersIdle
  value: true
- action: customEvent
  name: snapShotKeyFrame
  detail:
    deltaMS: 16
- action: screenshot
- action: customEvent
  name: vtAdvanceTimeoutClock
  detail:
    deltaMS: 400
- action: assert
  type: js
  fn: vtAssert.timersIdle
  value: true
- action: customEvent
  name: snapShotKeyFrame
  detail:
    deltaMS: 16
- action: screenshot
- action: customEvent
  name: vtAdvanceTimeoutClock
  detail:
    deltaMS: 30000
- action: assert
  type: js
  fn: vtAssert.timersIdle
  value: true
- action: customEvent
  name: snapShotKeyFrame
  detail:
    deltaMS: 16
- action: screenshot
