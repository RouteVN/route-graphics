---
title: RTL Text Revealing - Indicator Offsets
description: In right-to-left text the indicator offsetX moves along the text, which is to the left; offsetY moves down; colored indicator assets are intentional.
specs:
- the first indicator should sit just left of the last character
- the second should be pushed further left by offsetX
- the third should be shifted down by offsetY
- the fourth line ends in a Latin word; its indicator should still sit at the left end of the line
steps:
- action: screenshot
