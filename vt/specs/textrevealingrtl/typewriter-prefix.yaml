---
title: RTL Text Revealing - Initial Revealed Characters
description: initialRevealedCharacters keeps a right-to-left prefix visible and continues typing from there; colored indicator assets are intentional.
specs:
- the prefix should be visible on the first frame after the update
- typing should continue to the left of the prefix
steps:
- action: screenshot
- action: customEvent
  name: vtInstallTimeoutClock
- action: keypress
  key: n
- action: assert
  type: js
  fn: vtAssert.renderReady
  value: true
- action: customEvent
  name: vtAdvanceTimeoutClock
  detail:
    deltaMS: 1
- action: assert
  type: js
  fn: vtAssert.timersIdle
  value: true
- action: customEvent
  name: snapShotKeyFrame
  detail:
    deltaMS: 16
- action: screenshot
- action: customEvent
  name: vtAdvanceTimeoutClock
  detail:
    deltaMS: 400
- action: assert
  type: js
  fn: vtAssert.timersIdle
  value: true
- action: customEvent
  name: snapShotKeyFrame
  detail:
    deltaMS: 16
- action: screenshot
- action: customEvent
  name: vtAdvanceTimeoutClock
  detail:
    deltaMS: 30000
- action: assert
  type: js
  fn: vtAssert.timersIdle
  value: true
- action: customEvent
  name: snapShotKeyFrame
  detail:
    deltaMS: 16
- action: screenshot
---
states:
- id: prefix
  elements:
  - id: r
    type: text-revealing
    x: 300
    "y": 120
    direction: rtl
    width: 700
    revealEffect: none
    indicator:
      revealing:
        src: circle-red
        width: 14
        height: 14
      complete:
        src: circle-green
        width: 14
        height: 14
      offsetX: 10
    content:
    - text: الجملة الأولى.
      textStyle:
        fontSize: 34
        fill: '#FFFFFF'
        fontFamily:
        - NotoSansArabic
        - NotoSansHebrew
        - Arial
        lineHeight: 1.6
- id: continued
  elements:
  - id: r
    type: text-revealing
    x: 300
    "y": 120
    direction: rtl
    width: 700
    speed: 40
    initialRevealedCharacters: 14
    revealEffect: typewriter
    indicator:
      revealing:
        src: circle-red
        width: 14
        height: 14
      complete:
        src: circle-green
        width: 14
        height: 14
      offsetX: 10
    content:
    - text: الجملة الأولى.
      textStyle:
        fontSize: 34
        fill: '#FFFFFF'
        fontFamily:
        - NotoSansArabic
        - NotoSansHebrew
        - Arial
        lineHeight: 1.6
    - text: ' ثم يظهر باقي النص هنا.'
      textStyle:
        fontSize: 34
        fill: '#D9D9D9'
        fontFamily:
        - NotoSansArabic
        - NotoSansHebrew
        - Arial
        lineHeight: 1.6
