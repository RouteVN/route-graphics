---
title: Text Update Scale Auto To Unset Scale
description: A text element whose next state sets no scale, scaling with tween auto shorthand for scaleX and scaleY.
specs:
  - text should start at scale 0.5 on both axes
  - the next state sets no scale, so auto should resolve to scale 1
  - text should be at scale 0.75 halfway and at scale 1 when the animation ends
steps:
  - action: keypress
    key: "n"
  - action: customEvent
    name: "snapShotKeyFrame"
    detail:
      deltaMS: 300
  - action: screenshot
  - action: customEvent
    name: "snapShotKeyFrame"
    detail:
      deltaMS: 300
  - action: screenshot
---
states:
  - elements:
      - id: text1
        type: text
        content: Scaling Text Auto
        x: 260
        "y": 240
        scaleX: 0.5
        scaleY: 0.5
        textStyle:
          fontSize: 36
          fill: "#D9D9D9"
          fontFamily: Arial
  - elements:
      - id: text1
        type: text
        content: Scaling Text Auto
        x: 260
        "y": 240
        textStyle:
          fontSize: 36
          fill: "#D9D9D9"
          fontFamily: Arial
    animations:
      - id: text-scale-auto-unset
        targetId: text1
        type: update
        tween:
          scaleX:
            auto:
              duration: 600
              easing: linear
          scaleY:
            auto:
              duration: 600
              easing: linear
